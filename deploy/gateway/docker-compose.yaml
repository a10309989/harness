name: harness-gateway

services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HARNESS_GATEWAY_PORT:-8443}:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - harness_edge

networks:
  harness_edge:
    external: true
    name: ${HARNESS_EDGE_NETWORK:-harness-temporal_control-plane}
