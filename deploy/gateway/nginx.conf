worker_processes auto;

events {
    worker_connections 4096;
}

http {
    limit_req_zone $binary_remote_addr zone=harness_api:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=harness_conn:10m;

    map $http_x_auth_request_sub $gateway_subject {
        default $http_x_auth_request_sub;
        "" "anonymous";
    }

    upstream harness_api {
        server harness-api:8000;
        keepalive 64;
    }

    server {
        listen 8443 ssl http2;
        server_name harness.internal;

        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_client_certificate /etc/nginx/certs/client-ca.crt;
        ssl_verify_client on;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 1m;
        limit_req zone=harness_api burst=40 nodelay;
        limit_conn harness_conn 100;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Trace-Id $request_id;
            proxy_set_header traceparent $http_traceparent;

            proxy_set_header X-Auth-Request-Sub $gateway_subject;
            proxy_set_header X-Auth-Request-Email $http_x_auth_request_email;
            proxy_set_header X-Forwarded-Client-Cert $ssl_client_s_dn;
            proxy_set_header X-Harness-Quota-Subject $gateway_subject;
            proxy_set_header X-Harness-WAF-Verdict allow;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://harness_api;
        }
    }
}
